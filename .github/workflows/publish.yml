name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify release tag
        run: node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json')); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Tag must equal package version');"
      - name: Test every regression file sequentially
        run: |
          for test_file in test/*.test.mjs; do
            node --test --test-concurrency=1 "$test_file" || exit 1
          done
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
